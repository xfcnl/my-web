<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>术曲下载站 - xf_blog</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --text: #c9d1d9;
        --muted: #8b949e;
        --link: #58a6ff;
        --border: #30363d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .container {
        width: 100%;
        max-width: 720px;
        padding: 32px 20px;
      }

      h1 { margin-top: 0; font-size: 1.6rem; }
      h2 { font-size: 1.3rem; }
      h3 { font-size: 1.1rem; }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 24px;
        margin-bottom: 20px;
      }

      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover { text-decoration: underline; }

      .back-link {
        display: inline-block;
        margin-bottom: 4px;
        font-size: 0.9rem;
      }

      .section-title {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .stats-bar {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        gap: 12px;
      }

      .stat-item { text-align: center; padding: 8px 12px; }

      .stat-value {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--link);
      }

      .stat-label {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 2px;
      }

      .announcement-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .announcement-title {
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .refresh-button {
        background: var(--border);
        border: none;
        color: var(--muted);
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: inherit;
      }
      .refresh-button:hover { color: var(--text); background: #3a4049; }

      .release {
        padding: 16px;
        margin: 16px 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
      }

      .release-header h3 {
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .release-meta {
        display: flex;
        gap: 16px;
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      .download-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        margin: 8px 0;
        background: var(--panel);
        border-radius: 8px;
        border: 1px solid var(--border);
      }
      .download-item:hover { border-left: 3px solid var(--link); }

      .file-info { flex: 1; min-width: 0; }

      .file-name {
        font-weight: 600;
        display: block;
        margin-bottom: 4px;
        font-size: 0.95rem;
      }

      .file-size {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .download-options {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }

      .download-link {
        padding: 8px 14px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .download-link:not(.accelerated) {
        background: var(--border);
        color: var(--text);
        border: 1px solid transparent;
      }
      .download-link:not(.accelerated):hover { background: #3a4049; }

      .download-link.accelerated {
        background: var(--link);
        color: #fff;
      }
      .download-link.accelerated:hover { opacity: 0.85; }

      .toggle-assets {
        background: var(--border);
        color: var(--muted);
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-family: inherit;
        font-weight: 500;
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
      }
      .toggle-assets:hover { color: var(--text); background: #3a4049; }


      .loading-text {
        text-align: center;
        color: var(--muted);
        padding: 24px;
        font-size: 0.9rem;
      }
      .loading-text i { margin-right: 6px; animation: spin 1.5s linear infinite; }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      footer {
        margin-top: auto;
        padding: 20px 0;
        font-size: 0.9rem;
        color: var(--muted);
        text-align: center;
        width: 100%;
      }

      .footer-inner {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 20px;
      }

      @media (max-width: 600px) {
        .container { padding: 16px 12px; }
        .download-item { flex-direction: column; align-items: flex-start; gap: 10px; }
        .download-options { width: 100%; flex-direction: column; }
        .download-link { width: 100%; text-align: center; justify-content: center; }
        .stats-bar { flex-direction: column; gap: 8px; }
        .release-meta { flex-direction: column; gap: 4px; }
        .card { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <a href="https://lm-xiao-fen.github.io/my-web/index.html" class="back-link">
          <i class="fas fa-arrow-left"></i> 返回上一级
        </a>
        <h1>术曲下载站</h1>
      </div>

      <div class="card">
        <div class="announcement-header">
          <h2 class="announcement-title"><i class="fas fa-bullhorn"></i> 系统公告</h2>
          <button class="refresh-button" onclick="fetchAnnouncement()">
            <i class="fas fa-sync-alt"></i> 刷新
          </button>
        </div>
        <div id="announcement-content">
          <div class="loading-text"><i class="fas fa-spinner"></i> 加载公告中...</div>
        </div>
      </div>

      <div class="card">
        <div class="stats-bar">
          <div class="stat-item">
            <div class="stat-value" id="release-count">null</div>
            <div class="stat-label">资源发布</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="file-count">null</div>
            <div class="stat-label">文件总数</div>
          </div>

        </div>
      </div>

      <div class="card">
        <h2 class="section-title"><i class="fas fa-box-open"></i> 文件发布</h2>
        <div id="releases">
          <div class="loading-text"><i class="fas fa-spinner"></i> 加载发布文件中...</div>
        </div>
      </div>

    </div>

    <footer>
      <div class="footer-inner">
        <p style="margin-bottom:4px">&copy; web of lm-xiao-fen</p>
        <p>
          <a href="https://icp.we2050.com/id.php?keyword=20259950" target="_blank">
            <img src="https://icp.we2050.com/logo.png" width="20" height="20" style="vertical-align:middle;margin-right:4px" />团ICP备20259950号
          </a>
        </p>
      </div>
    </footer>

    <script>
      async function initialize() {
        try {
          await Promise.all([fetchAnnouncement(), fetchReleases()]);
        } catch (error) {
          showErrorNotification(`初始化失败: ${error.message}`);
        }
      }

      async function fetchAnnouncement() {
        const contentDiv = document.getElementById("announcement-content");
        try {
          contentDiv.innerHTML = '<div class="loading-text"><i class="fas fa-spinner"></i> 加载中...</div>';
          const response = await fetch("https://raw.githubusercontent.com/lm-xiao-fen/my-web/home/home.txt");
          if (!response.ok) throw new Error(`HTTP错误! 状态码: ${response.status}`);
          const text = await response.text();
          contentDiv.innerHTML = (text || "暂无公告").replace(/\n/g, "<br>");
        } catch (error) {
          contentDiv.innerHTML = `
            <div class="error-text">
              <i class="fas fa-exclamation-triangle"></i> ${escapeHtml(error.message)}
              <button onclick="fetchAnnouncement()" class="refresh-button" style="margin-top:10px;">
                <i class="fas fa-redo"></i> 重试
              </button>
            </div>
          `;
        }
      }

      async function fetchReleases() {
        try {
          const response = await fetch("https://api.github.com/repos/lm-xiao-fen/my-web/releases");
          if (!response.ok) throw new Error("获取发布信息失败");

          const releases = await response.json();
          const container = document.getElementById("releases");

          container.innerHTML = releases
            .map((release) => `
            <div class="release">
              <div class="release-header">
                <h3><i class="fas fa-tag"></i> ${escapeHtml(release.name)}</h3>
                <div class="release-meta">
                  <span><i class="fas fa-code-branch"></i> 版本：${escapeHtml(release.tag_name)}</span>
                  <span><i class="fas fa-calendar-alt"></i> 发布时间：${new Date(release.published_at).toLocaleDateString()}</span>
                </div>
              </div>
              <ul class="assets" style="display:none;list-style:none;padding:0;">
                ${release.assets.map((asset) => `
                  <li class="download-item">
                    <div class="file-info">
                      <span class="file-name"><i class="fas fa-file"></i> ${escapeHtml(asset.name)}</span>
                      <span class="file-size"><i class="fas fa-database"></i> ${formatFileSize(asset.size)}</span>
                    </div>
                    <div class="download-options">
                      <a href="${asset.browser_download_url}" class="download-link"><i class="fas fa-download"></i> 普通下载</a>
                      <a href="${generateProxyUrl(asset.browser_download_url)}" class="download-link accelerated"><i class="fas fa-bolt"></i> 高速下载</a>
                    </div>
                  </li>
                `).join("")}
              </ul>
              <button class="toggle-assets"><i class="fas fa-layer-group"></i> 显示资源</button>
            </div>
          `).join("");

          document.getElementById("release-count").textContent = releases.length;
          const totalFiles = releases.reduce((acc, release) => acc + release.assets.length, 0);
          document.getElementById("file-count").textContent = totalFiles;

          document.querySelectorAll(".toggle-assets").forEach((button) => {
            button.addEventListener("click", function () {
              const assetsList = this.previousElementSibling;
              const isHidden = assetsList.style.display === "none";
              assetsList.style.display = isHidden ? "block" : "none";
              this.innerHTML = isHidden
                ? '<i class="fas fa-layer-group"></i> 隐藏资源'
                : '<i class="fas fa-layer-group"></i> 显示资源';
            });
          });
        } catch (error) {
          showErrorNotification(`文件加载失败: ${error.message}`);
        }
      }


      function escapeHtml(unsafe) {
        return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
      }

      function generateProxyUrl(url) {
        return `https://ghproxy.net/${encodeURI(url)}`;
      }

      function formatFileSize(bytes) {
        const units = ["Bytes", "KB", "MB", "GB"];
        if (bytes == 0) return "0 Bytes";
        const exp = Math.floor(Math.log(bytes) / Math.log(1024));
        return `${(bytes / Math.pow(1024, exp)).toFixed(2)} ${units[exp]}`;
      }

      function showErrorNotification(message) {
        const notification = document.createElement("div");
        notification.style.cssText = "position:fixed;bottom:20px;right:20px;background:#2d1b1b;color:#f85149;padding:12px 20px;border-radius:8px;z-index:10000;display:flex;align-items:center;gap:10px;border:1px solid #f85149;font-size:0.9rem;";
        notification.innerHTML = `<span><i class="fas fa-exclamation-circle"></i> ${escapeHtml(message)}</span><button style="background:none;border:none;cursor:pointer;color:#f85149;font-size:1rem;"><i class="fas fa-times"></i></button>`;
        document.body.appendChild(notification);
        notification.querySelector("button").onclick = () => notification.remove();
        setTimeout(() => notification.remove(), 5000);
      }

      function showSuccessNotification(message) {
        const notification = document.createElement("div");
        notification.style.cssText = "position:fixed;bottom:20px;right:20px;background:#1b2d1b;color:#3fb950;padding:12px 20px;border-radius:8px;z-index:10000;display:flex;align-items:center;gap:10px;border:1px solid #3fb950;font-size:0.9rem;";
        notification.innerHTML = `<span><i class="fas fa-check-circle"></i> ${escapeHtml(message)}</span><button style="background:none;border:none;cursor:pointer;color:#3fb950;font-size:1rem;"><i class="fas fa-times"></i></button>`;
        document.body.appendChild(notification);
        notification.querySelector("button").onclick = () => notification.remove();
        setTimeout(() => notification.remove(), 5000);
      }

      document.addEventListener("DOMContentLoaded", initialize);
    </script>
  </body>
</html>
